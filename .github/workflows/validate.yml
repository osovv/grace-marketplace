name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI validation
        run: bun run validate:ci

      - name: Run local release consistency check
        run: bun run release:check

  windows-compatibility:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows path, shell, scope, and Unicode adapter regressions
        run: bun test src/grace4/paths.test.ts src/grace4/scope.test.ts src/grace4/assertions.test.ts src/lint/adapters/python.test.ts

      - name: Run Windows CLI integration regressions
        run: bun run validate:cli

  dart-adapter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the real Dart adapter regression
        run: bun test src/lint/adapters/dart.test.ts
